name: econ-slack-digest

on:
  schedule:
    # 매일 08:00 KST = 23:00 UTC (전날). cron 은 UTC 기준으로 해석됨.
    - cron: "0 23 * * *"
  workflow_dispatch: {}  # 수동 실행 버튼 (테스트용)

# 동시에 여러 번 돌지 않도록 (지연 실행이 겹칠 때 중복 전송 방지)
concurrency:
  group: econ-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LOOKBACK_HOURS: "24"
          MAX_PER_FEED: "5"
        run: python send_digest.py
